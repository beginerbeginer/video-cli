[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-cli"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3",
]

[project.optional-dependencies]
web = [
    "flask>=3.1.3",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools.packages.find]
include = ["domain*", "shared*", "validation*", "ffmpeg*", "ui*", "usecases*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

