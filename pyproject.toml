[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-cli"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.5",
    "flask>=3.1.3",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
web = [
    "flask>=3.1.3",
]

[project.scripts]
video-gui = "api.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
include = ["api*", "domain*", "shared*", "validation*", "ffmpeg*", "ui*", "usecases*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

