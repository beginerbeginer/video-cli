name: release-please

on:
  push:
    branches: [main]
  # マージを待たずにリリース用の PR を作り直したいとき用
  workflow_dispatch:

# issues: write は、リリース用の PR に付けるラベル（autorelease: pending など）を作るため。
# release-please-action の README が必要としている権限で、無いとラベル付けで失敗する。
permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Why not タグ（@v5）: この Action には contents: write を渡すので、
      # タグを付け替えられても中身が変わらないよう SHA で固定する。SHA は v5.0.0。
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
