name: conventional-commits

on:
  pull_request:
    branches: [main]
    # edited を含めるのは、タイトルを直したら確認をやり直すため
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: conventional-commits-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PR タイトルを確かめる（違えば失敗）
        # Why not run の中に ${{ github.event.pull_request.title }} を直接書く: タイトルにシェルの
        # 構文を書かれるとそのまま実行されてしまう。環境変数で渡せば文字列のまま扱える。
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/conventional_commits.py title "$PR_TITLE"

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR のコミットメッセージを集める
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git log -z --no-merges --format=%B "$BASE_SHA..$HEAD_SHA" > "$RUNNER_TEMP/commits.log"
      - name: コミットの 1 行目と Claude-Session トレーラーを確かめる（違っても警告だけ）
        run: python3 scripts/conventional_commits.py commits "$RUNNER_TEMP/commits.log"
