name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Why not リポジトリの既定値に任せる: 既定が書き込みだと、依存パッケージのインストール処理まで
# 書き込みのトークンで動く。テストは読み取りだけで足りる。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      # Why not `ruff format .`: CI で書き換えても main には反映されないので、確かめるだけにする
      - run: uv run ruff format --check .
      - run: uv run pytest
