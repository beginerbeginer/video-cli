name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Why not リポジトリの既定値に任せる: 既定が書き込みだと、依存パッケージのインストール処理まで
# 書き込みのトークンで動く。テストは読み取りだけで足りる。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # v8 から @v10 のようなメジャー版の浮動タグが出なくなり、公式 README も SHA での固定を勧めているので SHA で指定する
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync
      - run: uv run ruff check .
      # Why not `ruff format .`: CI で書き換えても main には反映されないので、確かめるだけにする
      - run: uv run ruff format --check .
      - run: uv run pytest
