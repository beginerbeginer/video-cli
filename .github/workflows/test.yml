name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # v8 から @v10 のようなメジャー版の浮動タグが出なくなり、公式 README も SHA での固定を勧めているので SHA で指定する
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest
