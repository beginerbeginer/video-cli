name: sync-labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - scripts/sync_labels.py
      - .github/workflows/sync-labels.yml
  # 定義ファイルが壊れていないかを、マージ前に PR で確かめる（--dry-run なので書き込まない）
  pull_request:
    branches: [main]
    paths:
      - .github/labels.json
      - scripts/sync_labels.py
      - .github/workflows/sync-labels.yml
  workflow_dispatch:

# Why not ワークフロー全体に issues: write: PR のコードまで書き込みのトークンで動いてしまう。
# 権限はジョブごとに、必要な分だけ付ける。
permissions: {}

concurrency:
  group: sync-labels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: 定義を確かめ、実行するコマンドを表示する
        run: python3 scripts/sync_labels.py .github/labels.json --dry-run

  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: ラベルを反映する
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_labels.py .github/labels.json
